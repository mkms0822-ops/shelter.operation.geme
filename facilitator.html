<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イベント・コントロール｜ファシリテーター</title>
<style>
  :root{
    --ink:#1b2733; --sub:#63727f; --line:#d3dde5; --bg:#eaeef1; --panel:#ffffff;
    --navy:#123a5e; --steel:#3f6f8f; --plan:#eef4f8;
    --info:#3f8ad1; --warn:#c98a1e; --danger:#d24b3e; --ok:#2e7d5b;
    --shadow:0 2px 10px rgba(20,45,70,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

  header{background:linear-gradient(135deg,var(--navy),#0d2b47);color:#fff;padding:11px 16px;display:flex;align-items:center;gap:12px;flex:none;position:sticky;top:0;z-index:5}
  header .logo{font-size:22px}
  header h1{font-size:16px;font-weight:800;letter-spacing:.02em}
  header h1 small{display:block;font-size:10px;color:#a9c7db;font-weight:600;letter-spacing:.1em}
  header .sp{flex:1}
  .conn{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.14);border-radius:20px;padding:5px 12px;display:flex;align-items:center;gap:7px}
  .conn .led{width:9px;height:9px;border-radius:50%;background:#c05a2a}
  .conn.ok .led{background:#5fd39a}

  #main{flex:1;display:grid;grid-template-columns:1fr 340px;gap:16px;padding:16px;max-width:1200px;width:100%;margin:0 auto}
  @media(max-width:860px){ #main{grid-template-columns:1fr} }
  @media(max-width:560px){
    header{flex-wrap:wrap;padding:9px 12px;gap:8px}
    header h1{font-size:15px}
    #main{padding:12px;gap:12px}
    .card{padding:14px}
  }

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  .card h2{font-size:13px;color:var(--navy);font-weight:800;letter-spacing:.03em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .card h2 .n{font-size:11px;color:var(--sub);font-weight:700}

  /* プリセットイベント */
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){ .presets{grid-template-columns:1fr} }
  .cardsearch{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;color:var(--ink);margin-bottom:12px}
  .cardsearch:focus{outline:none;border-color:var(--steel)}
  .catblock{border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden}
  .cathead{width:100%;display:flex;align-items:center;gap:10px;background:#f4f8fb;border:0;padding:12px 14px;cursor:pointer;font-family:inherit;text-align:left}
  .cathead:hover{background:#eef4f8}
  .cathead.open{background:#e8f0f6}
  .cathead .cicon{font-size:18px}
  .cathead .cname{font-size:14.5px;font-weight:800;color:var(--navy)}
  .cathead .ccount{font-size:11px;font-weight:800;color:#fff;background:var(--steel);border-radius:10px;padding:2px 9px;margin-left:auto}
  .cathead .carrow{font-size:11px;color:var(--sub);width:14px;text-align:center}
  .catbody{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:9px;background:#fff}
  @media(max-width:560px){ .catbody{grid-template-columns:1fr} }
  .preset{border:1px solid var(--line);border-left:4px solid var(--info);border-radius:10px;padding:11px 12px;cursor:pointer;background:#fff;transition:.12s;position:relative}
  .preset:hover{border-color:var(--steel);transform:translateY(-1px);box-shadow:0 3px 10px rgba(20,45,70,.12)}
  .preset.warn{border-left-color:var(--warn)}
  .preset.danger{border-left-color:var(--danger)}
  .preset .ptag{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--info);border-radius:10px;padding:1px 9px;margin-bottom:6px}
  .preset.warn .ptag{background:var(--warn)}
  .preset.danger .ptag{background:var(--danger)}
  .preset .pt{font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.4;margin-bottom:3px}
  .preset .pd{font-size:11.5px;color:var(--sub);line-height:1.5}
  .preset .send{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:800;color:var(--navy);opacity:0;transition:.12s}
  .preset:hover .send{opacity:1}

  /* 自由入力 */
  .fld{margin-bottom:11px}
  .fld label{display:block;font-size:11px;color:var(--sub);font-weight:700;margin-bottom:4px}
  .fld input,.fld textarea,.fld select{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:9px;font-size:13px;font-family:inherit;color:var(--ink)}
  .fld textarea{height:64px;resize:vertical}
  .sev-row{display:flex;gap:8px}
  .sev-row label{flex:1;border:1.5px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:12px;font-weight:800;cursor:pointer;color:var(--sub)}
  .sev-row input{display:none}
  .sev-row input:checked+span{}
  .sev-opt.info.on{border-color:var(--info);color:var(--info);background:#eef6fd}
  .sev-opt.warn.on{border-color:var(--warn);color:var(--warn);background:#fdf6e9}
  .sev-opt.danger.on{border-color:var(--danger);color:var(--danger);background:#fdeeec}

  .btn{width:100%;background:var(--navy);color:#fff;border:0;border-radius:9px;padding:12px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
  .btn:hover{background:#0d2b47}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .btn.danger{background:var(--danger)}
  .btn.danger:hover{background:#b23a2e}
  .btn.sm{padding:8px;font-size:12px}

  /* 送信ログ */
  .log{max-height:360px;overflow-y:auto}
  .logitem{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:8px;font-size:12px}
  .logitem .lh{display:flex;align-items:center;gap:7px;margin-bottom:3px}
  .logitem .ltag{font-size:9.5px;font-weight:800;color:#fff;background:var(--info);border-radius:9px;padding:1px 7px}
  .logitem.warn .ltag{background:var(--warn)} .logitem.danger .ltag{background:var(--danger)}
  .logitem .ltime{margin-left:auto;color:var(--sub);font-size:10.5px;font-weight:700}
  .logitem .llt{font-weight:800;color:var(--ink)}
  .logitem .lld{color:var(--sub);line-height:1.5;margin-top:2px}
  .empty{color:var(--sub);font-size:12px;text-align:center;padding:22px 8px;line-height:1.7}
  .grp-select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:11px 12px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff}
  .mgroup{margin-bottom:12px}
  .mgroup .mgh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .mgroup .mgdot{width:12px;height:12px;border-radius:50%;flex:none}
  .mgdot.green{background:#3f9e63} .mgdot.pink{background:#c25a86} .mgdot.orange{background:#c9832f} .mgdot.blue{background:#3f77b3}
  .mgroup .mgname{font-size:13px;font-weight:800;color:var(--ink)}
  .mgroup .mgcount{font-size:11px;color:var(--sub);font-weight:700}
  .mgroup .mgdel{margin-left:auto;font-size:10.5px;color:var(--danger);background:none;border:0;cursor:pointer;font-weight:700;font-family:inherit}
  .mgroup .names{display:flex;flex-wrap:wrap;gap:5px}
  .mgroup .nm{font-size:11.5px;background:#eef2f5;border-radius:12px;padding:3px 10px;color:#33404c;font-weight:600}
  .mgroup .none{font-size:11px;color:var(--sub)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ok);color:#fff;font-weight:800;font-size:13.5px;padding:12px 22px;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:.25s;z-index:50;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--danger)}

  /* ログイン画面 */
  #gate{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),#0d2b47);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
  #gate .box{background:#fff;width:100%;max-width:360px;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.35);padding:28px 26px;text-align:center}
  #gate .glogo{font-size:40px;margin-bottom:6px}
  #gate h2{font-size:17px;font-weight:900;color:var(--navy);margin-bottom:4px}
  #gate p{font-size:12px;color:var(--sub);line-height:1.6;margin-bottom:18px}
  #gate input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;text-align:center;letter-spacing:.1em;margin-bottom:12px}
  #gate input:focus{outline:none;border-color:var(--steel)}
  #gate button{width:100%;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:800;font-size:14.5px;cursor:pointer;font-family:inherit}
  #gate button:hover{background:#0d2b47}
  #gate .err{font-size:12px;color:var(--danger);font-weight:700;min-height:18px;margin-bottom:8px}
  #gate .remember{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:var(--sub);margin-top:12px;cursor:pointer}
  #gate.hide{display:none}
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="gate">
  <div class="box">
    <div class="glogo">🔒</div>
    <h2>ファシリテーター用</h2>
    <p>この画面はイベントを送信する管理画面です。<br>合言葉を入力してください。</p>
    <div class="err" id="gate-err"></div>
    <input type="password" id="gate-pw" placeholder="合言葉" autocomplete="off"
      onkeydown="if(event.key==='Enter')tryUnlock()">
    <button id="gate-btn" onclick="tryUnlock()">入室する</button>
    <label class="remember"><input type="checkbox" id="gate-remember" checked> この端末では次回から省略</label>
  </div>
</div>

<div id="app">
  <header>
    <span class="logo">🎛️</span>
    <h1>イベント・コントロール<small>FACILITATOR CONTROL SYSTEM</small></h1>
    <span class="sp"></span>
    <div class="conn" id="conn"><span class="led"></span><span id="conntxt">未接続</span></div>
    <button onclick="lockAgain()" style="background:rgba(255,255,255,.14);border:0;color:#fff;font-weight:700;font-size:11.5px;border-radius:20px;padding:6px 12px;cursor:pointer;font-family:inherit">🔒 ロック</button>
  </header>

  <div id="main">
    <div>
      <!-- プリセットイベント -->
      <div class="card">
        <h2>⚡ イベントを発生させる <span class="n">カテゴリーをタップで展開・カードをタップで送信</span></h2>
        <input type="text" id="cardsearch" class="cardsearch" placeholder="🔍 キーワードで検索（例：トイレ、糖尿病、余震…）" oninput="renderPresets()">
        <div id="catlist"></div>
        <div class="presets" id="presets" style="display:none"></div>
      </div>

      <!-- 送信ログ（スマホでは下に来る） -->
      <div class="card" id="logcard-mobile" style="display:none"></div>
    </div>

    <div>
      <!-- 自由入力 -->
      <div class="card">
        <h2>✏️ 自由にイベントを作る</h2>
        <div class="fld"><label>タグ（分類）</label><input id="f-tag" placeholder="例：医療 / 衛生 / 物資"></div>
        <div class="fld"><label>タイトル</label><input id="f-title" placeholder="例：発熱者が複数、感染の疑い"></div>
        <div class="fld"><label>詳細</label><textarea id="f-detail" placeholder="状況の説明。プレイヤーはこれを読んで対応します。"></textarea></div>
        <div class="fld">
          <label>深刻度</label>
          <div class="sev-row" id="sevrow">
            <label class="sev-opt info on"><input type="radio" name="sev" value="info" checked>情報</label>
            <label class="sev-opt warn"><input type="radio" name="sev" value="warn">注意</label>
            <label class="sev-opt danger"><input type="radio" name="sev" value="danger">緊急</label>
          </div>
        </div>
        <div class="fld">
          <label>送信先グループ</label>
          <select id="f-group" class="grp-select"><option value="all">🌐 全グループ</option></select>
        </div>
        <button class="btn" id="sendbtn" onclick="sendCustom()">📣 このイベントを送信</button>
      </div>

      <!-- 参加者・グループ -->
      <div class="card">
        <h2>👥 参加者・グループ</h2>
        <div id="memberpanel"><div class="empty">読み込み中…</div></div>
        <details style="margin-top:10px">
          <summary style="cursor:pointer;font-size:12.5px;font-weight:800;color:var(--navy)">＋ グループを追加・削除</summary>
          <div style="margin-top:10px">
            <div class="fld" style="display:flex;gap:6px;align-items:flex-end">
              <div style="flex:1"><label>新しいグループ名</label><input id="ng-name" placeholder="例：レッド班"></div>
              <select id="ng-color" class="grp-select" style="width:auto">
                <option value="green">緑</option><option value="pink">桃</option>
                <option value="orange">橙</option><option value="blue" selected>青</option>
              </select>
            </div>
            <button class="btn sm" onclick="addGroup()">グループを追加</button>
          </div>
        </details>
      </div>

      <!-- 送信ログ -->
      <div class="card">
        <h2>🗒 送信ログ</h2>
        <div class="log" id="log"><div class="empty">まだイベントを送信していません。</div></div>
        <button class="btn danger sm" style="margin-top:6px" onclick="clearSession()">🔄 セッションをリセット（全消去）</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 設定：GASのウェブアプリURLを設定 =====
var GAS_URL = 'https://script.google.com/macros/s/AKfycbyz6f5re-l13zlIpq_TNMKpJyURr1-rmIAKoD6ss_smgVGreFY-_7-pgxZzua5vcafilA/exec';

// ===== 認証（サーバー側判定）=====
// 合言葉は GAS 側の FACILITATOR_PASSWORD に設定します。ここには書きません。
// ログイン成功でGASが発行したトークンを保持し、送信・リセット時に添付します。
var AUTH_TOKEN = null;
try { AUTH_TOKEN = localStorage.getItem('facil_token') || null; } catch(e){}

// ログイン：合言葉をGASへ送って照合
function tryUnlock(){
  var v = document.getElementById('gate-pw').value;
  if(!v){ return; }
  if(!GAS_URL || GAS_URL.indexOf('script.google.com')<0){
    document.getElementById('gate-err').textContent='GAS_URL が未設定です。';
    return;
  }
  var btn = document.getElementById('gate-btn');
  btn.disabled = true; btn.textContent = '確認中…';
  document.getElementById('gate-err').textContent='';
  fetch(GAS_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'login', password:v})
  }).then(function(r){ return r.json(); }).then(function(res){
    btn.disabled=false; btn.textContent='入室する';
    if(res && res.ok && res.token){
      AUTH_TOKEN = res.token;
      if(document.getElementById('gate-remember').checked){
        try{ localStorage.setItem('facil_token', AUTH_TOKEN); }catch(e){}
      }
      document.getElementById('gate').classList.add('hide');
      document.getElementById('gate-pw').value='';
      refreshLog();
      loadGroupsList();
      refreshMembers();
    } else {
      document.getElementById('gate-err').textContent='合言葉が違います。';
      document.getElementById('gate-pw').value='';
      document.getElementById('gate-pw').focus();
    }
  }).catch(function(){
    btn.disabled=false; btn.textContent='入室する';
    document.getElementById('gate-err').textContent='通信エラー（URL/デプロイを確認）。';
  });
}

// 手動で再ロック（トークン破棄）
function lockAgain(){
  AUTH_TOKEN = null;
  try{ localStorage.removeItem('facil_token'); }catch(e){}
  document.getElementById('gate-pw').value='';
  document.getElementById('gate-err').textContent='';
  document.getElementById('gate').classList.remove('hide');
  document.getElementById('gate-pw').focus();
}

// 起動時：保存済みトークンがあれば、GASに有効か確認してから解除
(function(){
  if(AUTH_TOKEN && GAS_URL.indexOf('script.google.com')>=0){
    fetch(GAS_URL+'?action=list&token='+encodeURIComponent(AUTH_TOKEN))
      .then(function(r){ return r.json(); }).then(function(res){
        if(res && res.ok){ document.getElementById('gate').classList.add('hide'); }
        else { lockAgain(); }
      }).catch(function(){ document.getElementById('gate-pw').focus(); });
  } else {
    document.getElementById('gate-pw').focus();
  }
})();

// プリセットイベント（避難所運営の実話ベース）
var PRESETS = [
  {cat:"季節",icon:"🌦",tag:"季節",kw:"熱中症",severity:"danger",title:"室温が上がり熱中症の症状を訴える人が続出",detail:"空調が不足し日中の気温が上昇。高齢者や子どもがぐったり。冷却・水分・涼しい場所の確保をどうする？"},
  {cat:"季節",icon:"🌦",tag:"季節",kw:"しもやけ・低体温",severity:"warn",title:"冷え込みで低体温・しもやけの訴え",detail:"夜間の冷え込みが厳しく、毛布が不足。高齢者に低体温の兆候。暖房と防寒具の配分をどう決める？"},
  {cat:"季節",icon:"🌦",tag:"季節",kw:"乾燥",severity:"info",title:"空気の乾燥で喉の不調・肌荒れが増加",detail:"暖房で空気が乾燥し、咳や肌荒れの訴え。加湿・こまめな水分補給・換気のバランスをどうする？"},
  {cat:"季節",icon:"🌦",tag:"季節",kw:"多湿・カビ",severity:"warn",title:"梅雨時の多湿で寝具にカビ",detail:"湿度が高く寝具や床がじめじめ。カビや異臭が発生。換気・除湿・寝具の乾燥をどう回す？"},
  {cat:"季節",icon:"🌦",tag:"季節",kw:"花粉・アレルギー",severity:"info",title:"花粉の飛散でアレルギー症状",detail:"花粉シーズンでくしゃみ・目のかゆみを訴える人が増加。換気と症状緩和をどう両立する？"},
  {cat:"季節",icon:"🌦",tag:"季節",kw:"猛暑の停電",severity:"danger",title:"猛暑日に空調が止まった",detail:"気温35℃超の日に空調が停止。熱中症リスクが急上昇。優先的に冷やす場所と人をどう決める？"},
  {cat:"季節",icon:"🌦",tag:"季節",kw:"大雪・積雪",severity:"warn",title:"大雪で出入口や物資搬入が困難",detail:"積雪で出入口が塞がれ、支援物資のトラックが近づけない。除雪と搬入経路をどう確保する？"},
  {cat:"季節",icon:"🌦",tag:"季節",kw:"台風接近の蒸し暑さ",severity:"info",title:"台風前の蒸し暑さで体調不良",detail:"台風接近で気圧が下がり、頭痛やだるさの訴え。窓を閉め切る中での暑さ対策をどうする？"},
  {cat:"季節",icon:"🌦",tag:"季節",kw:"インフル流行期",severity:"warn",title:"季節性インフルエンザの流行期",detail:"外部で流行が始まり、避難所内でも発熱者が。予防・隔離・マスク配布をどう進める？"},
  {cat:"季節",icon:"🌦",tag:"季節",kw:"日照不足の気分不調",severity:"info",title:"曇天続きで気分の落ち込み",detail:"悪天候が続き屋外に出られず、気分の落ち込みを訴える人が増加。心のケアと居場所をどう作る？"},
  {cat:"衛生",icon:"🚽",tag:"衛生",kw:"トイレ不足",severity:"warn",title:"仮設トイレが足りず行列",detail:"トイレの数が足りず長い行列。特に女性・高齢者から不満。数・位置・動線をどう見直す？"},

var GAS_OK = false;

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, err){
  var t=document.getElementById('toast'); t.textContent=msg;
  t.className='toast show'+(err?' err':''); setTimeout(function(){ t.className='toast'; }, 2200);
}
function setConn(ok){
  GAS_OK=ok;
  var c=document.getElementById('conn'); c.className='conn'+(ok?' ok':'');
  document.getElementById('conntxt').textContent = ok ? '接続OK' : '未接続 / URL未設定';
}

// カテゴリーの開閉状態
var openCats = {};

// プリセット描画（カテゴリー別アコーディオン＋検索）
function renderPresets(){
  var box=document.getElementById('catlist');
  if(!box) return;
  var q = (document.getElementById('cardsearch').value||'').trim().toLowerCase();

  // カテゴリー順を維持しつつグループ化
  var order=[]; var byCat={};
  PRESETS.forEach(function(p){
    if(!byCat[p.cat]){ byCat[p.cat]=[]; order.push({cat:p.cat, icon:p.icon}); }
    byCat[p.cat].push(p);
  });

  // 検索時のフィルタ
  function match(p){
    if(!q) return true;
    return (p.title+' '+p.detail+' '+p.kw+' '+p.cat).toLowerCase().indexOf(q)>=0;
  }

  var html='';
  var anyHit=false;
  order.forEach(function(o){
    var items=byCat[o.cat].filter(match);
    if(!items.length) return;
    anyHit=true;
    // 検索中は自動展開、通常は開閉状態に従う
    var open = q ? true : !!openCats[o.cat];
    html+='<div class="catblock">'+
      '<button class="cathead'+(open?' open':'')+'" onclick="toggleCat(\''+esc(o.cat).replace(/'/g,"\\'")+'\')">'+
        '<span class="cicon">'+esc(o.icon)+'</span><span class="cname">'+esc(o.cat)+'</span>'+
        '<span class="ccount">'+items.length+'</span><span class="carrow">'+(open?'▲':'▼')+'</span>'+
      '</button>'+
      '<div class="catbody" style="display:'+(open?'block':'none')+'">'+
        items.map(function(p){
          var cls=p.severity==='danger'?'danger':p.severity==='warn'?'warn':'';
          return '<div class="preset '+cls+'" onclick="sendPreset('+PRESETS.indexOf(p)+')">'+
            '<span class="ptag">'+esc(p.kw)+'</span><span class="send">送信 ▶</span>'+
            '<div class="pt">'+esc(p.title)+'</div><div class="pd">'+esc(p.detail)+'</div></div>';
        }).join('')+
      '</div></div>';
  });
  if(!anyHit){ html='<div class="empty">「'+esc(q)+'」に一致するイベントは見つかりませんでした。</div>'; }
  box.innerHTML=html;
}
function toggleCat(cat){ openCats[cat]=!openCats[cat]; renderPresets(); }
function sendPreset(i){ var p=PRESETS[i]; if(p) send(p); }

// 互換：初期化
function buildPresets(){ renderPresets(); }

// 送信（共通）
function send(ev){
  if(!GAS_URL || GAS_URL.indexOf('script.google.com')<0){
    toast('GAS_URL が未設定です', true); return;
  }
  var grpSel=document.getElementById('f-group');
  var grp = grpSel ? grpSel.value : 'all';
  var body = { action:'send', token:AUTH_TOKEN, tag:ev.tag, title:ev.title, detail:ev.detail, severity:ev.severity||'info', group:grp };
  fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // プリフライト回避
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); }).then(function(res){
    if(res && res.ok){
      var gl = grp==='all' ? '全グループ' : grp;
      toast('送信（'+gl+'）：'+ev.title); setConn(true); refreshLog();
    }
    else if(res && res.error==='unauthorized'){ toast('セッションが切れました。再ログインしてください', true); lockAgain(); }
    else { toast('送信に失敗しました', true); }
  }).catch(function(){ toast('通信エラー（URL/デプロイを確認）', true); setConn(false); });
}

function sendCustom(){
  var title=document.getElementById('f-title').value.trim();
  if(!title){ toast('タイトルを入力してください', true); return; }
  var sev=document.querySelector('input[name=sev]:checked').value;
  send({
    tag: document.getElementById('f-tag').value.trim() || '状況',
    title: title,
    detail: document.getElementById('f-detail').value.trim(),
    severity: sev
  });
  document.getElementById('f-title').value='';
  document.getElementById('f-detail').value='';
}

// 送信ログの取得
function refreshLog(){
  if(!GAS_URL || GAS_URL.indexOf('script.google.com')<0){ setConn(false); return; }
  if(!AUTH_TOKEN){ return; } // 未ログイン時は取得しない
  fetch(GAS_URL+'?action=list&token='+encodeURIComponent(AUTH_TOKEN)).then(function(r){ return r.json(); }).then(function(res){
    if(res && res.error==='unauthorized'){ setConn(true); lockAgain(); return; }
    setConn(true);
    var log=document.getElementById('log');
    if(!res.events || !res.events.length){ log.innerHTML='<div class="empty">まだイベントを送信していません。</div>'; return; }
    log.innerHTML = res.events.slice().reverse().map(function(ev){
      var cls = ev.severity==='danger'?'danger':ev.severity==='warn'?'warn':'';
      var gl = (ev.group && ev.group!=='all') ? ev.group : '全体';
      return '<div class="logitem '+cls+'"><div class="lh"><span class="ltag">'+esc(ev.tag)+'</span>'+
        '<span class="ltag" style="background:#eef2f5;color:#33404c">'+esc(gl)+'</span>'+
        '<span class="ltime">'+esc(ev.time)+'</span></div>'+
        '<div class="llt">'+esc(ev.title)+'</div>'+
        (ev.detail?'<div class="lld">'+esc(ev.detail)+'</div>':'')+'</div>';
    }).join('');
  }).catch(function(){ setConn(false); });
}

function clearSession(){
  var grpSel=document.getElementById('f-group');
  var grp = grpSel ? grpSel.value : 'all';
  var gl = grp==='all' ? '全グループ' : grp;
  var msg = grp==='all'
    ? '全グループの送信済みイベントをすべて消去します。よろしいですか？'
    : '「'+gl+'」のイベントを消去します。よろしいですか？';
  if(!confirm(msg)) return;
  var body = {action:'clear', token:AUTH_TOKEN};
  if(grp!=='all') body.group = grp;
  fetch(GAS_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); }).then(function(res){
    if(res && res.error==='unauthorized'){ toast('セッションが切れました。再ログインしてください', true); lockAgain(); return; }
    toast('リセットしました（'+gl+'）'); refreshLog();
  }).catch(function(){ toast('リセットに失敗しました', true); });
}

var FGROUPS = [];
function colorClass_(c){ return ['green','pink','orange','blue'].indexOf(c)>=0 ? c : 'blue'; }

function loadGroupsList(){
  fetch(GAS_URL+'?action=groups').then(function(r){return r.json();}).then(function(res){
    FGROUPS = (res && res.groups) ? res.groups : [];
    renderGroupSelect();
  }).catch(function(){});
}
function renderGroupSelect(){
  var sel=document.getElementById('f-group');
  if(!sel) return;
  var cur = sel.value;
  var html = '<option value="all">🌐 全グループ</option>';
  html += FGROUPS.map(function(g){ return '<option value="'+esc(g.name)+'">'+esc(g.name)+'</option>'; }).join('');
  sel.innerHTML = html;
  // 選択を維持
  if(cur){ sel.value = cur; }
}
function addGroup(){
  var name=(document.getElementById('ng-name').value||'').trim();
  var color=document.getElementById('ng-color').value;
  if(!name){ toast('グループ名を入力してください', true); return; }
  fetch(GAS_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'addGroup', token:AUTH_TOKEN, name:name, color:color})
  }).then(function(r){return r.json();}).then(function(res){
    if(res && res.error==='unauthorized'){ toast('セッション切れ。再ログインを', true); lockAgain(); return; }
    if(res && res.ok){
      FGROUPS = res.groups || FGROUPS;
      document.getElementById('ng-name').value='';
      toast('グループを追加しました：'+name);
      renderGroupSelect(); refreshMembers();
    }
  }).catch(function(){ toast('追加に失敗しました', true); });
}
function delGroup(name){
  if(!confirm('グループ「'+name+'」を削除しますか？（このグループの参加者表示も消えます）')) return;
  fetch(GAS_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'delGroup', token:AUTH_TOKEN, name:name})
  }).then(function(r){return r.json();}).then(function(res){
    if(res && res.error==='unauthorized'){ toast('セッション切れ。再ログインを', true); lockAgain(); return; }
    FGROUPS = (res && res.groups) ? res.groups : FGROUPS;
    toast('グループを削除しました');
    renderGroupSelect(); refreshMembers();
  }).catch(function(){ toast('削除に失敗しました', true); });
}

// ===== 参加者一覧 =====
function refreshMembers(){
  fetch(GAS_URL+'?action=members').then(function(r){return r.json();}).then(function(res){
    var members = (res && res.members) ? res.members : [];
    renderMembers(members);
  }).catch(function(){});
}
function renderMembers(members){
  var panel=document.getElementById('memberpanel');
  if(!panel) return;
  if(!FGROUPS.length){
    panel.innerHTML='<div class="empty">グループがありません。下から追加してください。</div>';
    return;
  }
  // グループごとに参加者を分類
  var byGroup = {};
  FGROUPS.forEach(function(g){ byGroup[g.name]=[]; });
  var ungrouped=[];
  members.forEach(function(m){
    if(byGroup[m.group]) byGroup[m.group].push(m.name);
    else ungrouped.push(m.name + (m.group?'（'+m.group+'）':''));
  });
  var html = FGROUPS.map(function(g){
    var cc=colorClass_(g.color);
    var names = byGroup[g.name];
    var namesHtml = names.length
      ? names.map(function(n){ return '<span class="nm">'+esc(n)+'</span>'; }).join('')
      : '<span class="none">まだ参加者がいません</span>';
    return '<div class="mgroup"><div class="mgh">'+
      '<span class="mgdot '+cc+'"></span>'+
      '<span class="mgname">'+esc(g.name)+'</span>'+
      '<span class="mgcount">'+names.length+'人</span>'+
      '<button class="mgdel" onclick="delGroup(\''+esc(g.name).replace(/'/g,"\\'")+'\')">削除</button>'+
      '</div><div class="names">'+namesHtml+'</div></div>';
  }).join('');
  if(ungrouped.length){
    html += '<div class="mgroup"><div class="mgh"><span class="mgname">未分類</span>'+
      '<span class="mgcount">'+ungrouped.length+'人</span></div><div class="names">'+
      ungrouped.map(function(n){return '<span class="nm">'+esc(n)+'</span>';}).join('')+'</div></div>';
  }
  panel.innerHTML = html;
}


buildPresets();
refreshLog();
loadGroupsList();
refreshMembers();
setInterval(refreshLog, 8000);
setInterval(refreshMembers, 8000);
</script>
