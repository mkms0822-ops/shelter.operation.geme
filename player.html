<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>掲示板｜避難所オペレーション</title>
<style>
  :root{
    --ink:#1b2733; --sub:#63727f; --line:#d3dde5; --bg:#eaeef1; --panel:#ffffff;
    --navy:#123a5e; --steel:#3f6f8f;
    --info:#3f8ad1; --warn:#c98a1e; --danger:#d24b3e; --ok:#2e7d5b;
  }
  body.theme-green  { --bg:#e6f4ea; }
  body.theme-pink   { --bg:#fbe9f0; }
  body.theme-orange { --bg:#fdeede; }
  body.theme-blue   { --bg:#e5eef8; }
  body.fs-sm { font-size:14px; } body.fs-md { font-size:16px; } body.fs-lg { font-size:19px; }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

  header{background:linear-gradient(135deg,var(--navy),#0d2b47);color:#fff;padding:11px 16px;display:flex;align-items:center;gap:12px;flex:none}
  header .logo{font-size:22px}
  header h1{font-size:16px;font-weight:800}
  header h1 small{display:block;font-size:10px;color:#a9c7db;font-weight:600;letter-spacing:.1em}
  header .sp{flex:1}
  .hbtn{background:rgba(255,255,255,.14);border:0;color:#fff;font-size:16px;border-radius:20px;width:34px;height:34px;cursor:pointer;flex:none}
  .hbtn:hover{background:rgba(255,255,255,.26)}
  .conn{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.14);border-radius:20px;padding:5px 12px;display:flex;align-items:center;gap:7px}
  .conn .led{width:9px;height:9px;border-radius:50%;background:#c05a2a}
  .conn.ok .led{background:#5fd39a;box-shadow:0 0 0 0 rgba(95,211,154,.7);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,211,154,.6)}70%{box-shadow:0 0 0 7px rgba(95,211,154,0)}100%{box-shadow:0 0 0 0 rgba(95,211,154,0)}}

  /* タブ */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 0;flex:none;-webkit-overflow-scrolling:touch}
  .tab{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:11px 11px 0 0;padding:9px 15px;font-size:13.5px;font-weight:800;color:var(--sub);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px;position:relative}
  .tab .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .dot-green{background:#3f9e63} .dot-pink{background:#c25a86} .dot-orange{background:#c9832f} .dot-blue{background:#3f77b3} .dot-all{background:#7a8a97}
  .tab.on{color:var(--navy);border-color:var(--steel);border-bottom-color:#fff;background:#fff;box-shadow:0 -2px 8px rgba(18,58,94,.06)}
  .tab .cnt{font-size:10.5px;font-weight:800;color:#fff;background:var(--steel);border-radius:9px;padding:1px 7px}
  .tab .newbadge{width:8px;height:8px;border-radius:50%;background:var(--danger);position:absolute;top:6px;right:6px;display:none}
  .tab.hasnew .newbadge{display:block}

  main{flex:1;max-width:760px;width:100%;margin:0 auto;padding:14px 14px 30px}

  /* メモ欄 */
  .memo{background:#fffef4;border:1px solid #e6dfa8;border-radius:12px;padding:12px 13px;margin-bottom:16px}
  .memo h3{font-size:12px;color:#8a7a1e;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .memo textarea{width:100%;min-height:88px;border:1px solid #e0d9a0;border-radius:9px;padding:10px 11px;font-size:14px;font-family:inherit;color:var(--ink);background:#fffdf0;resize:vertical;line-height:1.6}
  .memo textarea:focus{outline:none;border-color:#c9a94a}
  .memo .mfoot{display:flex;align-items:center;gap:10px;margin-top:8px}
  .memo .msave{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:9px 20px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
  .memo .msave:hover{background:#0d2b47}
  .memo .mstat{font-size:11px;color:var(--sub);font-weight:700}

  /* イベント一覧 */
  .sec-h{font-size:12px;color:var(--sub);font-weight:800;letter-spacing:.04em;margin:4px 2px 10px}
  .evitem{background:#fff;border:1px solid var(--line);border-left:4px solid var(--info);border-radius:11px;padding:13px 15px;margin-bottom:11px}
  .evitem.warn{border-left-color:var(--warn)} .evitem.danger{border-left-color:var(--danger)}
  .evitem .eh{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
  .evitem .etag{font-size:10.5px;font-weight:800;color:#fff;background:var(--info);border-radius:10px;padding:2px 10px}
  .evitem.warn .etag{background:var(--warn)} .evitem.danger .etag{background:var(--danger)}
  .evitem .egrp{font-size:10.5px;font-weight:800;color:#33404c;background:#eef2f5;border-radius:10px;padding:2px 10px}
  .evitem .etime{margin-left:auto;font-size:10.5px;color:var(--sub);font-weight:700}
  .evitem .et{font-size:15.5px;font-weight:800;color:var(--ink);line-height:1.4}
  .evitem .ed{font-size:13px;color:#33404c;line-height:1.65;margin-top:4px}
  .empty{color:var(--sub);font-size:12.5px;text-align:center;padding:26px 10px;line-height:1.8}
  body.fs-lg .et{font-size:19px} body.fs-lg .ed{font-size:16px} body.fs-lg .memo textarea{font-size:17px}
  body.fs-sm .et{font-size:14px} body.fs-sm .ed{font-size:11.5px} body.fs-sm .memo textarea{font-size:12.5px}

  #dbg{max-width:760px;margin:0 auto;padding:0 14px 16px;font-size:11px;color:#8b98a5;font-family:monospace}

  /* 設定パネル */
  #setpanel{position:fixed;top:56px;right:12px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.22);padding:14px 16px;z-index:150;display:none;min-width:240px}
  #setpanel.show{display:block}
  .set-row{display:flex;align-items:center;gap:10px;margin:10px 0}
  .set-row:first-child{margin-top:2px}
  .set-t{font-size:12px;font-weight:800;color:var(--sub);width:60px;flex:none}
  .seg{display:flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{background:#fff;border:0;padding:8px 15px;font-size:13.5px;font-weight:800;color:var(--sub);cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--navy);color:#fff}
  .swatches{display:flex;gap:7px;align-items:center}
  .sw{width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,.12);cursor:pointer;font-size:13px;color:var(--sub);display:flex;align-items:center;justify-content:center}
  .sw.on{border-color:var(--navy);box-shadow:0 0 0 2px rgba(18,58,94,.2)}
  .sw-green{background:#e6f4ea} .sw-pink{background:#fbe9f0} .sw-orange{background:#fdeede} .sw-blue{background:#e5eef8} .sw-none{background:#fff}
</style>
</head>
<body>

<!-- 設定パネル -->
<div id="setpanel">
  <div class="set-row">
    <span class="set-t">文字サイズ</span>
    <div class="seg">
      <button data-fs="sm" onclick="setFont('sm')">小</button>
      <button data-fs="md" class="on" onclick="setFont('md')">中</button>
      <button data-fs="lg" onclick="setFont('lg')">大</button>
    </div>
  </div>
  <div class="set-row">
    <span class="set-t">背景色</span>
    <div class="swatches">
      <button class="sw sw-green"  data-th="green"  onclick="setTheme('green')"></button>
      <button class="sw sw-pink"   data-th="pink"   onclick="setTheme('pink')"></button>
      <button class="sw sw-orange" data-th="orange" onclick="setTheme('orange')"></button>
      <button class="sw sw-blue"   data-th="blue"   onclick="setTheme('blue')"></button>
      <button class="sw sw-none"   data-th=""       onclick="setTheme('')">×</button>
    </div>
  </div>
</div>

<div id="app">
  <header>
    <span class="logo">📋</span>
    <h1>イベント掲示板<small>SHELTER BULLETIN BOARD</small></h1>
    <span class="sp"></span>
    <button class="hbtn" onclick="toggleSettings()" title="表示設定">⚙️</button>
    <div class="conn" id="conn"><span class="led"></span><span id="conntxt">接続中…</span></div>
  </header>

  <div class="tabs" id="tabs"></div>

  <main id="main">
    <div class="empty">読み込み中…</div>
  </main>

  <div id="dbg"></div>
</div>

<script>
// ===== 設定：GASのウェブアプリURL（他ファイルと同じもの） =====
var GAS_URL = 'https://script.google.com/macros/s/AKfycbyz6f5re-l13zlIpq_TNMKpJyURr1-rmIAKoD6ss_smgVGreFY-_7-pgxZzua5vcafilA/exec';

var POLL_MS = 5000;
var ALL = 'all';

var groups = [];          // [{name,color}]
var eventsAll = [];       // 全イベント
var memos = {};           // {group: {text, updated}}
var curTab = ALL;         // 選択中タブ（'all' or グループ名）
var seenCount = {};       // タブごとに既読件数（新着バッジ用）
var editing = false;      // メモ編集中はメモ欄を上書きしない
var jsonpBusy = false, jsonpSeq = 0;

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function colorClass(c){ return ['green','pink','orange','blue'].indexOf(c)>=0 ? c : 'all'; }
function setConn(ok){ var c=document.getElementById('conn'); c.className='conn'+(ok?' ok':''); document.getElementById('conntxt').textContent=ok?'接続中':'未接続'; }
function dbg(m){ var d=document.getElementById('dbg'); if(d) d.textContent=m; }

// ===== 表示設定 =====
function setFont(sz){
  document.body.classList.remove('fs-sm','fs-md','fs-lg');
  document.body.classList.add('fs-'+sz);
  var seg=document.querySelectorAll('.seg button');
  for(var i=0;i<seg.length;i++) seg[i].classList.toggle('on', seg[i].getAttribute('data-fs')===sz);
  try{ localStorage.setItem('ui_font', sz); }catch(e){}
}
function setTheme(th){
  document.body.classList.remove('theme-green','theme-pink','theme-orange','theme-blue');
  if(th) document.body.classList.add('theme-'+th);
  var sw=document.querySelectorAll('.swatches .sw');
  for(var i=0;i<sw.length;i++) sw[i].classList.toggle('on', sw[i].getAttribute('data-th')===th);
  try{ localStorage.setItem('ui_theme', th); }catch(e){}
}
function toggleSettings(){ document.getElementById('setpanel').classList.toggle('show'); }
(function initUI(){
  var f='md', t='';
  try{ f=localStorage.getItem('ui_font')||'md'; }catch(e){}
  try{ t=localStorage.getItem('ui_theme')||''; }catch(e){}
  setFont(f); setTheme(t);
  // 既読件数を復元
  try{ seenCount = JSON.parse(localStorage.getItem('board_seen')||'{}')||{}; }catch(e){ seenCount={}; }
})();
function saveSeen(){ try{ localStorage.setItem('board_seen', JSON.stringify(seenCount)); }catch(e){} }

// ===== データ取得（JSONP：board = 全イベント＋メモ＋グループ） =====
function poll(){
  if(!GAS_URL || GAS_URL.indexOf('script.google.com')<0){ setConn(false); dbg('GAS_URL未設定'); return; }
  if(jsonpBusy) return;
  jsonpBusy = true;
  var cb='boardCb_'+(++jsonpSeq)+'_'+Date.now();
  var s=document.createElement('script'); var done=false;
  var timer=setTimeout(function(){ setConn(false); dbg('通信エラー（次回再取得）'); cleanup(); }, POLL_MS+6000);
  function cleanup(){ if(done)return; done=true; jsonpBusy=false; try{delete window[cb];}catch(e){} if(s.parentNode)s.parentNode.removeChild(s); clearTimeout(timer); }
  window[cb]=function(res){ try{ handle(res); }catch(e){} cleanup(); };
  s.onerror=function(){ setConn(false); dbg('通信エラー（次回再取得）'); cleanup(); };
  s.src=GAS_URL+'?action=board&callback='+cb;
  document.head.appendChild(s);
}

function handle(res){
  setConn(true);
  groups = (res && res.groups) ? res.groups : groups;
  eventsAll = (res && res.events) ? res.events : [];
  // メモ編集中はサーバーのメモで上書きしない（自分の入力を守る）
  if(!editing){ memos = (res && res.memos) ? res.memos : {}; }
  dbg('接続OK / イベント'+eventsAll.length+'件 / '+ (groups.length) +'グループ');
  renderTabs();
  if(editing){ renderEventsOnly(); }  // 編集中はイベント部分だけ更新
  else { renderBody(); }
}

// タブ一覧（全体＋各グループ）
function renderTabs(){
  var el=document.getElementById('tabs');
  var tabs=[{name:ALL, color:'all', label:'🌐 全体'}];
  groups.forEach(function(g){ tabs.push({name:g.name, color:colorClass(g.color), label:g.name}); });

  el.innerHTML=tabs.map(function(t){
    var list=eventsForTab(t.name);
    var cnt=list.length;
    var seen=seenCount[t.name]||0;
    var hasNew = cnt>seen && t.name!==curTab;
    return '<button class="tab '+(t.name===curTab?'on':'')+(hasNew?' hasnew':'')+'" onclick="selectTab(\''+esc(t.name).replace(/'/g,"\\'")+'\')">'+
      '<span class="dot dot-'+t.color+'"></span>'+esc(t.label)+
      '<span class="cnt">'+cnt+'</span><span class="newbadge"></span></button>';
  }).join('');
}

// タブに属するイベント（全体=all宛て＋全部、グループ=そのグループ＋all宛て）
function eventsForTab(tab){
  if(tab===ALL){ return eventsAll.slice(); }
  return eventsAll.filter(function(ev){ return ev.group===tab || ev.group===ALL; });
}

function selectTab(name){
  // メモ編集中に切り替える場合は破棄確認
  if(editing){
    if(!confirm('メモが保存されていません。切り替えると入力内容が失われます。よろしいですか？')) return;
    editing=false;
  }
  curTab=name;
  // 既読を更新
  seenCount[name]=eventsForTab(name).length; saveSeen();
  renderTabs(); renderBody();
}

function eventsListHtml(){
  var list=eventsForTab(curTab).slice().reverse();
  if(!list.length){
    return '<div class="empty">まだこのタブにイベントはありません。<br>ファシリテーターが送信すると、ここに掲示されます。</div>';
  }
  return '<div class="sec-h">📌 届いたイベント（新しい順・'+list.length+'件）</div>'+
    list.map(function(ev){
      var cls=ev.severity==='danger'?'danger':ev.severity==='warn'?'warn':'';
      var g = (ev.group && ev.group!==ALL) ? ev.group : '全体';
      return '<div class="evitem '+cls+'"><div class="eh">'+
        '<span class="etag">'+esc(ev.tag||'状況')+'</span>'+
        '<span class="egrp">'+esc(g)+'</span>'+
        '<span class="etime">'+esc(ev.time||'')+'</span></div>'+
        '<div class="et">'+esc(ev.title||'')+'</div>'+
        (ev.detail?'<div class="ed">'+esc(ev.detail)+'</div>':'')+'</div>';
    }).join('');
}

// 編集中：メモ欄はそのまま、イベント一覧だけ差し替え
function renderEventsOnly(){
  var holder=document.getElementById('evholder');
  if(holder){ holder.innerHTML=eventsListHtml(); }
}

function renderBody(){
  var main=document.getElementById('main');
  var tabLabel = curTab===ALL ? '全体' : curTab;

  var memoHtml='';
  if(curTab!==ALL){
    var m=memos[curTab]||{text:'',updated:''};
    memoHtml =
      '<div class="memo"><h3>📝 '+esc(tabLabel)+' のメモ（全員で共有）</h3>'+
      '<textarea id="memoText" placeholder="このグループの方針・気づき・決定事項を書き込みましょう。保存すると全員に共有されます。" '+
        'oninput="onMemoInput()">'+esc(m.text)+'</textarea>'+
      '<div class="mfoot"><button class="msave" onclick="saveMemo()">保存する</button>'+
      '<span class="mstat" id="memoStat">'+(m.updated?('最終更新 '+esc(m.updated)):'')+'</span></div></div>';
  }

  main.innerHTML = memoHtml + '<div id="evholder">'+eventsListHtml()+'</div>';
}

// メモ入力開始（ポーリングでの上書きを止める）
function onMemoInput(){ editing=true; }

// メモ保存（GAS共有）
function saveMemo(){
  var ta=document.getElementById('memoText');
  if(!ta) return;
  var text=ta.value;
  var stat=document.getElementById('memoStat');
  stat.textContent='保存中…';
  fetch(GAS_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'saveMemo', group:curTab, text:text})
  }).then(function(r){return r.json();}).then(function(res){
    editing=false;
    if(res && res.ok){
      if(!memos[curTab]) memos[curTab]={};
      memos[curTab].text=text; memos[curTab].updated=res.updated||'';
      stat.textContent='保存しました（'+(res.updated||'')+'）';
    } else { stat.textContent='保存に失敗しました'; }
  }).catch(function(){ editing=false; stat.textContent='通信エラーで保存できませんでした'; });
}

// ===== 起動 =====
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
