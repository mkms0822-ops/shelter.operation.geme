<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プレイヤー画面｜避難所ゲーム</title>
<style>
  :root{
    --ink:#1b2733; --sub:#63727f; --line:#d3dde5; --bg:#eaeef1; --panel:#ffffff;
    --navy:#123a5e; --steel:#3f6f8f;
    --info:#3f8ad1; --warn:#c98a1e; --danger:#d24b3e; --ok:#2e7d5b;
    --fs:1;              /* 文字サイズ倍率（小0.9/中1/大1.2） */
  }
  /* パステル背景テーマ（bodyのクラスで切替） */
  body.theme-green  { --bg:#e6f4ea; }
  body.theme-pink   { --bg:#fbe9f0; }
  body.theme-orange { --bg:#fdeede; }
  body.theme-blue   { --bg:#e5eef8; }
  /* 文字サイズ（全体をemベースで拡縮） */
  body.fs-sm { font-size:15px; }
  body.fs-md { font-size:16.5px; }
  body.fs-lg { font-size:20px; }
  /* 主要テキストを文字サイズ設定に連動させる（大/小で読みやすく） */
  body.fs-sm #wait h2{font-size:16px}   body.fs-lg #wait h2{font-size:24px}
  body.fs-sm #wait p{font-size:12px}    body.fs-lg #wait p{font-size:17px}
  body.fs-sm .ptitle{font-size:17px}    body.fs-lg .ptitle{font-size:26px}
  body.fs-sm .pdetail{font-size:12.5px} body.fs-lg .pdetail{font-size:18px}
  body.fs-sm .pask{font-size:11px}      body.fs-lg .pask{font-size:15px}
  body.fs-sm .band .bsev{font-size:13px} body.fs-lg .band .bsev{font-size:19px}
  body.fs-sm .band .btag{font-size:10px} body.fs-lg .band .btag{font-size:13px}
  body.fs-sm .popup .ok{font-size:13px}  body.fs-lg .popup .ok{font-size:18px}
  body.fs-sm .hitem .ht{font-size:13px} body.fs-lg .hitem .ht{font-size:18px}
  body.fs-sm .hitem .hd{font-size:11px} body.fs-lg .hitem .hd{font-size:15px}
  body.fs-lg header h1{font-size:19px}  body.fs-sm header h1{font-size:14px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

  header{background:linear-gradient(135deg,var(--navy),#0d2b47);color:#fff;padding:11px 16px;display:flex;align-items:center;gap:12px;flex:none}
  header .logo{font-size:22px}
  header h1{font-size:16px;font-weight:800}
  header h1 small{display:block;font-size:10px;color:#a9c7db;font-weight:600;letter-spacing:.1em}
  header .sp{flex:1}
  .conn{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.14);border-radius:20px;padding:5px 12px;display:flex;align-items:center;gap:7px}
  .conn .led{width:9px;height:9px;border-radius:50%;background:#c05a2a}
  .conn.ok .led{background:#5fd39a;box-shadow:0 0 0 0 rgba(95,211,154,.7);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,211,154,.6)}70%{box-shadow:0 0 0 7px rgba(95,211,154,0)}100%{box-shadow:0 0 0 0 rgba(95,211,154,0)}}

  #wait{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--sub)}
  #wait .big{font-size:56px;margin-bottom:16px;opacity:.5}
  #wait h2{font-size:18px;color:var(--navy);font-weight:800;margin-bottom:8px}
  #wait p{font-size:13.5px;line-height:1.8}
  .dots span{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:var(--steel);opacity:.4;animation:bounce 1.4s infinite}
  .dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-6px)}}

  /* 履歴 */
  #history{max-width:640px;width:100%;margin:0 auto;padding:16px;display:none}
  #history h3{font-size:12px;color:var(--sub);font-weight:800;letter-spacing:.05em;margin-bottom:10px}
  .hitem{background:#fff;border:1px solid var(--line);border-left:4px solid var(--info);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .hitem.warn{border-left-color:var(--warn)} .hitem.danger{border-left-color:var(--danger)}
  .hitem .hh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .hitem .htag{font-size:10px;font-weight:800;color:#fff;background:var(--info);border-radius:10px;padding:1px 9px}
  .hitem.warn .htag{background:var(--warn)} .hitem.danger .htag{background:var(--danger)}
  .hitem .htime{margin-left:auto;font-size:10.5px;color:var(--sub);font-weight:700}
  .hitem .ht{font-size:14.5px;font-weight:800;color:var(--ink)}
  .hitem .hd{font-size:12.5px;color:#33404c;line-height:1.6;margin-top:3px}

  /* ポップアップ */
  #overlay{position:fixed;inset:0;background:rgba(10,25,40,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  #overlay.show{display:flex;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .popup{background:#fff;width:100%;max-width:480px;border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .35s cubic-bezier(.2,1.1,.4,1)}
  @keyframes pop{0%{transform:scale(.82) translateY(20px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
  .popup .band{padding:16px 22px;color:#fff;display:flex;align-items:center;gap:12px}
  .popup .band .bic{font-size:30px;line-height:1}
  .popup .band .btag{font-size:11px;font-weight:800;letter-spacing:.05em;opacity:.92}
  .popup .band .bsev{font-size:15px;font-weight:900}
  .popup.info  .band{background:linear-gradient(135deg,var(--info),#2f6fa8)}
  .popup.warn  .band{background:linear-gradient(135deg,var(--warn),#a8720f)}
  .popup.danger .band{background:linear-gradient(135deg,var(--danger),#a5352a)}
  .popup.danger{animation:pop .35s cubic-bezier(.2,1.1,.4,1), shake .5s .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .popup .pbody{padding:20px 22px 8px}
  .popup .ptitle{font-size:20px;font-weight:900;color:var(--ink);line-height:1.35;margin-bottom:10px}
  .popup .pdetail{font-size:14px;color:#33404c;line-height:1.7}
  .popup .pask{font-size:12.5px;color:var(--sub);background:#f4f8fb;border-radius:10px;padding:11px 13px;line-height:1.6;margin-top:14px}
  .popup .pfoot{padding:14px 22px 20px;display:flex;gap:10px;align-items:center}
  .popup .ptime{font-size:11px;color:var(--sub);font-weight:700}
  .popup .queue{font-size:11px;color:var(--sub);font-weight:700}
  .popup .sp{flex:1}
  .popup .ok{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:12px 26px;font-weight:800;font-size:14.5px;cursor:pointer;font-family:inherit}
  .popup .ok:hover{background:#0d2b47}

  .toggle{position:fixed;right:14px;bottom:14px;background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:9px 15px;font-size:12px;font-weight:800;color:var(--navy);cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12);z-index:40}
  /* ===== ヘッダー追加要素 ===== */
  .hbtn{background:rgba(255,255,255,.14);border:0;color:#fff;font-size:16px;border-radius:20px;width:34px;height:34px;cursor:pointer;flex:none}
  .hbtn:hover{background:rgba(255,255,255,.26)}
  .gbadge{font-size:12px;font-weight:800;color:#fff;border-radius:20px;padding:5px 13px;background:var(--steel)}
  .gbadge.g-green{background:#3f9e63} .gbadge.g-pink{background:#c25a86}
  .gbadge.g-orange{background:#c9832f} .gbadge.g-blue{background:#3f77b3}

  /* ===== 参加登録ゲート ===== */
  #joingate{position:fixed;inset:0;background:linear-gradient(160deg,#123a5e,#0d2b47);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
  #joingate.hide{display:none}
  .jg-box{background:#fff;width:100%;max-width:400px;border-radius:20px;padding:26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
  .jg-logo{font-size:44px}
  .jg-box h2{font-size:20px;color:var(--navy);font-weight:900;margin:6px 0}
  .jg-lead{font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:18px}
  .jg-label{display:block;text-align:left;font-size:12px;font-weight:800;color:var(--sub);margin:12px 0 6px}
  .jg-input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;font-size:16px;font-family:inherit;color:var(--ink)}
  .jg-input:focus{outline:none;border-color:var(--steel)}
  .jg-groups{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
  .jg-loading{grid-column:1/-1;color:var(--sub);font-size:12px;padding:12px}
  .jg-g{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 10px;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;justify-content:center}
  .jg-g .dot{width:14px;height:14px;border-radius:50%;flex:none}
  .jg-g.sel{border-color:var(--navy);background:#f2f7fb;box-shadow:0 0 0 2px rgba(18,58,94,.12)}
  .dot-green{background:#3f9e63} .dot-pink{background:#c25a86} .dot-orange{background:#c9832f} .dot-blue{background:#3f77b3}
  .jg-err{color:var(--danger);font-size:12.5px;font-weight:700;min-height:18px;margin:10px 0 2px}
  .jg-go{width:100%;background:var(--navy);color:#fff;border:0;border-radius:12px;padding:14px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:4px}
  .jg-go:hover{background:#0d2b47}

  /* ===== 表示設定パネル ===== */
  #setpanel{position:fixed;top:56px;right:12px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.22);padding:14px 16px;z-index:150;display:none;min-width:250px}
  #setpanel.show{display:block}
  .set-row{display:flex;align-items:center;gap:10px;margin:10px 0}
  .set-row:first-child{margin-top:2px}
  .set-t{font-size:12px;font-weight:800;color:var(--sub);width:66px;flex:none}
  .seg{display:flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{background:#fff;border:0;padding:8px 15px;font-size:13.5px;font-weight:800;color:var(--sub);cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--navy);color:#fff}
  .swatches{display:flex;gap:7px;align-items:center}
  .sw{width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,.12);cursor:pointer;font-size:13px;color:var(--sub);display:flex;align-items:center;justify-content:center}
  .sw.on{border-color:var(--navy);box-shadow:0 0 0 2px rgba(18,58,94,.2)}
  .sw-green{background:#e6f4ea} .sw-pink{background:#fbe9f0} .sw-orange{background:#fdeede} .sw-blue{background:#e5eef8} .sw-none{background:#fff}
  .set-leave{background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
  .set-leave:hover{background:#f4f8fb}

</style>
</head>
<body>

<!-- ===== 参加登録ゲート（名前＋グループ） ===== -->
<div id="joingate">
  <div class="jg-box">
    <div class="jg-logo">🚨</div>
    <h2>避難所オペレーション</h2>
    <p class="jg-lead">お名前を入力し、参加するグループを選んでください。</p>
    <label class="jg-label">お名前（ニックネーム可）</label>
    <input type="text" id="jg-name" class="jg-input" placeholder="例：山田" maxlength="20" autocomplete="off">
    <label class="jg-label">グループ</label>
    <div id="jg-groups" class="jg-groups"><div class="jg-loading">グループを読み込み中…</div></div>
    <div class="jg-err" id="jg-err"></div>
    <button class="jg-go" id="jg-go" onclick="doJoin()">この内容で参加する ✓</button>
  </div>
</div>

<!-- ===== 表示設定パネル ===== -->
<div id="setpanel">
  <div class="set-inner">
    <div class="set-row">
      <span class="set-t">文字サイズ</span>
      <div class="seg">
        <button data-fs="sm" onclick="setFont('sm')">小</button>
        <button data-fs="md" class="on" onclick="setFont('md')">中</button>
        <button data-fs="lg" onclick="setFont('lg')">大</button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-t">背景色</span>
      <div class="swatches">
        <button class="sw sw-green"  data-th="green"  onclick="setTheme('green')"  title="グリーン"></button>
        <button class="sw sw-pink"   data-th="pink"   onclick="setTheme('pink')"   title="ピンク"></button>
        <button class="sw sw-orange" data-th="orange" onclick="setTheme('orange')" title="オレンジ"></button>
        <button class="sw sw-blue"   data-th="blue"   onclick="setTheme('blue')"   title="ブルー"></button>
        <button class="sw sw-none"   data-th=""       onclick="setTheme('')"       title="なし">×</button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-t">参加情報</span>
      <button class="set-leave" onclick="leaveGroup()">名前・グループを変更</button>
    </div>
  </div>
</div>

<div id="app">
  <header>
    <span class="logo">🚨</span>
    <h1>避難所オペレーション<small>PLAYER SCREEN</small></h1>
    <span class="sp"></span>
    <span class="gbadge" id="gbadge" style="display:none"></span>
    <button class="hbtn" id="setbtn" onclick="toggleSettings()" title="表示設定">⚙️</button>
    <div class="conn" id="conn"><span class="led"></span><span id="conntxt">接続中…</span></div>
  </header>

  <div id="wait">
    <div class="big">🏢</div>
    <h2>イベント発生を待機中</h2>
    <p>ファシリテーターがイベントを発生させると、<br>この画面にポップアップで通知が届きます。</p>
    <div class="dots" style="margin-top:14px"><span></span><span></span><span></span></div>
    <div id="dbg" style="margin-top:20px;font-size:11px;color:#8b98a5;font-family:monospace"></div>
    <button onclick="resetSeen()" style="margin-top:10px;font-size:11px;color:#63727f;background:#fff;border:1px solid #d3dde5;border-radius:20px;padding:6px 14px;cursor:pointer;font-family:inherit">既読をリセット（最初から受信し直す）</button>
  </div>

  <div id="history">
    <h3>📜 これまでのイベント</h3>
    <div id="hlist"></div>
  </div>
</div>

<button class="toggle" id="toggle" onclick="toggleHistory()" style="display:none">📜 履歴</button>

<!-- ポップアップ -->
<div id="overlay">
  <div class="popup" id="popup">
    <div class="band">
      <span class="bic" id="p-ic">⚠️</span>
      <div>
        <div class="btag" id="p-tag">状況</div>
        <div class="bsev" id="p-sev">イベント発生</div>
      </div>
    </div>
    <div class="pbody">
      <div class="ptitle" id="p-title"></div>
      <div class="pdetail" id="p-detail"></div>
      <div class="pask">この状況にどう対応しますか？ 図面の配置を動かし、部屋のメモに方針を書きながらチームで話し合いましょう。正解は一つではありません。</div>
    </div>
    <div class="pfoot">
      <span class="ptime" id="p-time"></span>
      <span class="sp"></span>
      <span class="queue" id="p-queue"></span>
      <button class="ok" onclick="closePopup()">対応する ✓</button>
    </div>
  </div>
</div>

<audio id="ding" preload="auto"></audio>

<script>
// ===== 設定：GASのウェブアプリURL（facilitator.html と同じもの） =====
var GAS_URL = 'https://script.google.com/macros/s/AKfycbyz6f5re-l13zlIpq_TNMKpJyURr1-rmIAKoD6ss_smgVGreFY-_7-pgxZzua5vcafilA/exec';

// ===================================================================
// 表示設定（文字サイズ・背景色）— 各端末に保存
// ===================================================================
function setFont(sz){
  document.body.classList.remove('fs-sm','fs-md','fs-lg');
  document.body.classList.add('fs-'+sz);
  var seg=document.querySelectorAll('.seg button');
  for(var i=0;i<seg.length;i++) seg[i].classList.toggle('on', seg[i].getAttribute('data-fs')===sz);
  try{ localStorage.setItem('ui_font', sz); }catch(e){}
}
function setTheme(th){
  document.body.classList.remove('theme-green','theme-pink','theme-orange','theme-blue');
  if(th) document.body.classList.add('theme-'+th);
  var sw=document.querySelectorAll('.swatches .sw');
  for(var i=0;i<sw.length;i++) sw[i].classList.toggle('on', sw[i].getAttribute('data-th')===th);
  try{ localStorage.setItem('ui_theme', th); }catch(e){}
}
function toggleSettings(){
  document.getElementById('setpanel').classList.toggle('show');
}
// 起動時に保存済み設定を適用
(function initUI(){
  var f='md', t='';
  try{ f=localStorage.getItem('ui_font')||'md'; }catch(e){}
  try{ t=localStorage.getItem('ui_theme')||''; }catch(e){}
  setFont(f); setTheme(t);
})();

// ===================================================================
// 参加登録（名前＋グループ）
// ===================================================================
var MY = { id:null, name:null, group:null, color:null };
try {
  var saved = JSON.parse(localStorage.getItem('sos_member')||'null');
  if(saved && saved.name){ MY = saved; }
} catch(e){}
var selectedGroup = null;   // ゲートで選択中のグループ
var GROUPS = [];

function colorClass(c){ return ['green','pink','orange','blue'].indexOf(c)>=0 ? c : 'blue'; }

// グループ一覧をJSONPで取得してゲートに描画
function loadGroups(){
  var cb='grpCb_'+Date.now();
  var s=document.createElement('script');
  var to=setTimeout(function(){ cleanup(); showGroupError(); }, 8000);
  function cleanup(){ try{delete window[cb];}catch(e){} if(s.parentNode)s.parentNode.removeChild(s); clearTimeout(to); }
  window[cb]=function(res){
    cleanup();
    GROUPS = (res && res.groups) ? res.groups : [];
    renderGroupChoices();
  };
  s.onerror=function(){ cleanup(); showGroupError(); };
  s.src=GAS_URL+'?action=groups&callback='+cb;
  document.head.appendChild(s);
}
function showGroupError(){
  var box=document.getElementById('jg-groups');
  if(box) box.innerHTML='<div class="jg-loading">グループを取得できませんでした。ネットワークを確認してください。</div>';
}
function renderGroupChoices(){
  var box=document.getElementById('jg-groups');
  if(!GROUPS.length){ box.innerHTML='<div class="jg-loading">グループが登録されていません。ファシリテーターに連絡してください。</div>'; return; }
  box.innerHTML = GROUPS.map(function(g){
    var cc=colorClass(g.color);
    return '<button class="jg-g" data-g="'+esc(g.name)+'" onclick="selectGroup(this)">'+
      '<span class="dot dot-'+cc+'"></span>'+esc(g.name)+'</button>';
  }).join('');
}
function selectGroup(btn){
  selectedGroup = btn.getAttribute('data-g');
  var all=document.querySelectorAll('#jg-groups .jg-g');
  for(var i=0;i<all.length;i++) all[i].classList.toggle('sel', all[i]===btn);
}
function doJoin(){
  var name=(document.getElementById('jg-name').value||'').trim();
  var err=document.getElementById('jg-err');
  if(!name){ err.textContent='お名前を入力してください。'; return; }
  if(!selectedGroup){ err.textContent='グループを選んでください。'; return; }
  err.textContent='';
  document.getElementById('jg-go').disabled=true;
  document.getElementById('jg-go').textContent='参加中…';

  // GASに登録（POST）。失敗してもローカルで参加は続行できる。
  fetch(GAS_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'join', name:name, group:selectedGroup})
  }).then(function(r){return r.json();}).then(function(res){
    finishJoin(name, selectedGroup, res && res.id ? res.id : null);
  }).catch(function(){
    finishJoin(name, selectedGroup, null);
  });
}
function finishJoin(name, group, id){
  var g = GROUPS.filter(function(x){return x.name===group;})[0];
  MY = { id:id, name:name, group:group, color: g?colorClass(g.color):'blue' };
  try{ localStorage.setItem('sos_member', JSON.stringify(MY)); }catch(e){}
  applyMember();
  document.getElementById('joingate').classList.add('hide');
  // 参加後、そのグループのイベントを最初から受信し直す
  resetSeen();
}
function applyMember(){
  var b=document.getElementById('gbadge');
  if(MY.name && MY.group){
    b.textContent = MY.group + '／' + MY.name;
    b.className = 'gbadge g-' + colorClass(MY.color);
    b.style.display='inline-block';
  } else {
    b.style.display='none';
  }
}
function leaveGroup(){
  if(!confirm('名前とグループを変更しますか？（この端末の登録を解除します）')) return;
  // GASから退出（任意）
  if(MY.id){
    try{
      fetch(GAS_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'leave', id:MY.id})});
    }catch(e){}
  }
  MY = { id:null, name:null, group:null, color:null };
  try{ localStorage.removeItem('sos_member'); }catch(e){}
  selectedGroup=null;
  document.getElementById('setpanel').classList.remove('show');
  document.getElementById('jg-go').disabled=false;
  document.getElementById('jg-go').textContent='この内容で参加する ✓';
  document.getElementById('jg-name').value='';
  document.getElementById('joingate').classList.remove('hide');
  applyMember();
  loadGroups();
}


var POLL_MS = 4000;          // 取得間隔
var queue = [];              // 表示待ちイベント
var showing = false;
var evHistory = [];
var queued = {};             // 取得済みidの記録（二重登録防止）
var currentEvId = null;      // 現在ポップアップ表示中のイベントid

// 「どのidまで表示したか（＝既読）」をブラウザに記憶。
// 既読IDは "ポップアップを閉じたとき" にだけ進める（通信不安定でも取りこぼさない）。
var SEEN_KEY = 'shelter_seen_id';
var lastId = 0;
try { lastId = parseInt(localStorage.getItem(SEEN_KEY) || '0', 10) || 0; } catch(e){ lastId = 0; }

function saveSeen(id){ try{ localStorage.setItem(SEEN_KEY, String(id)); }catch(e){} }

var SEV = {
  info:   {ic:'ℹ️', label:'お知らせ'},
  warn:   {ic:'⚠️', label:'注意が必要'},
  danger: {ic:'🚨', label:'緊急事態'}
};

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function setConn(ok){
  var c=document.getElementById('conn'); c.className='conn'+(ok?' ok':'');
  document.getElementById('conntxt').textContent = ok ? '接続中' : '未接続';
}

function dbg(msg){
  var d=document.getElementById('dbg'); if(d) d.textContent=msg;
}

// 既読をリセット（テスト用：もう一度すべてのイベントを受信し直す）
function resetSeen(){
  lastId = 0;
  saveSeen(0);
  queue = [];
  evHistory = [];
  queued = {};
  currentEvId = null;
  dbg('既読をリセットしました。次回取得から全イベントを受信します。');
}

function beep(){
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,ctx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.5);
    o.start(); o.stop(ctx.currentTime+.5);
  }catch(e){}
}

var jsonpBusy = false;       // 多重リクエスト防止
var jsonpSeq = 0;            // コールバック名の連番

function handlePollResult(res){
  setConn(true);
  var n = (res.events && res.events.length) ? res.events.length : 0;
  dbg('接続OK / 既読ID:'+lastId+' / 未表示:'+queue.length+'件 / サーバー最新ID:'+(res.lastId!=null?res.lastId:'?'));
  if(n){
    res.events.forEach(function(ev){
      if(!ev || ev.id==null) return;
      if(ev.id<=lastId) return;
      if(queued[ev.id]) return;
      queued[ev.id]=true;
      queue.push(ev);
      evHistory.push(ev);
    });
    try { renderHistory(); } catch(e){ /* 履歴描画で失敗してもポップアップは出す */ }
    pump();
  }
}

// JSONP方式：<script>タグで取得することで GAS の302リダイレクトを回避する
function poll(){
  if(!MY.name || !MY.group){ return; }  // 未登録なら受信しない
  if(!GAS_URL || GAS_URL.indexOf('script.google.com')<0){ setConn(false); dbg('GAS_URL未設定'); return; }
  if(jsonpBusy) return;   // 前回未完了ならスキップ
  jsonpBusy = true;

  var cbName = 'gasCb_' + (++jsonpSeq) + '_' + Date.now();
  var script = document.createElement('script');
  var done = false;

  function cleanup(){
    if(done) return;
    done = true;
    jsonpBusy = false;
    try { delete window[cbName]; } catch(e){ window[cbName] = undefined; }
    if(script.parentNode) script.parentNode.removeChild(script);
    clearTimeout(timer);
  }

  window[cbName] = function(res){ handlePollResult(res); cleanup(); };

  var timer = setTimeout(function(){
    setConn(false);
    dbg('通信エラー（応答なし・次回再取得します）');
    cleanup();
  }, POLL_MS + 6000);

  script.onerror = function(){
    setConn(false);
    dbg('通信エラー（次回再取得します）');
    cleanup();
  };

  script.src = GAS_URL + '?action=poll&since=' + lastId + '&group=' + encodeURIComponent(MY.group||'all') + '&callback=' + cbName;
  document.head.appendChild(script);
}

function pump(){
  if(showing || !queue.length) return;
  showPopup(queue.shift());
}

function showPopup(ev){
  showing=true;
  currentEvId = ev.id;   // 表示中イベントのidを覚えておく
  var sev = SEV[ev.severity] || SEV.info;
  var pop=document.getElementById('popup');
  pop.className='popup '+(ev.severity||'info');
  document.getElementById('p-ic').textContent=sev.ic;
  document.getElementById('p-tag').textContent=ev.tag||'状況';
  document.getElementById('p-sev').textContent=sev.label;
  document.getElementById('p-title').textContent=ev.title||'';
  document.getElementById('p-detail').textContent=ev.detail||'';
  document.getElementById('p-time').textContent='発生 '+(ev.time||'');
  document.getElementById('p-queue').textContent = queue.length ? ('待機 '+queue.length+'件') : '';
  document.getElementById('overlay').classList.add('show');
  beep();
}

function closePopup(){
  // 見終わった＝この時点で初めて既読IDを確定・保存（取りこぼし防止）
  if(currentEvId && currentEvId>lastId){ lastId=currentEvId; saveSeen(lastId); }
  currentEvId = null;
  document.getElementById('overlay').classList.remove('show');
  showing=false;
  setTimeout(pump, 350); // 次のイベントがあれば続けて表示
}

function renderHistory(){
  var hl=document.getElementById('hlist');
  if(!hl) return;
  if(!evHistory.length){ return; }
  var tg=document.getElementById('toggle');
  if(tg) tg.style.display='block';
  hl.innerHTML = evHistory.slice().reverse().map(function(ev){
    if(!ev) return '';
    var sev = ev.severity;
    var cls = sev==='danger'?'danger':sev==='warn'?'warn':'';
    return '<div class="hitem '+cls+'"><div class="hh"><span class="htag">'+esc(ev.tag)+'</span>'+
      '<span class="htime">'+esc(ev.time)+'</span></div>'+
      '<div class="ht">'+esc(ev.title)+'</div>'+
      (ev.detail?'<div class="hd">'+esc(ev.detail)+'</div>':'')+'</div>';
  }).join('');
}

var histOpen=false;
function toggleHistory(){
  histOpen=!histOpen;
  document.getElementById('history').style.display=histOpen?'block':'none';
  document.getElementById('wait').style.display=histOpen?'none':'flex';
  document.getElementById('toggle').textContent=histOpen?'✕ 閉じる':'📜 履歴';
}

// ===== 起動 =====
applyMember();
if(MY.name && MY.group){
  // 登録済み：ゲートを隠してすぐ受信開始
  document.getElementById('joingate').classList.add('hide');
} else {
  // 未登録：ゲートを表示してグループ選択
  document.getElementById('joingate').classList.remove('hide');
  loadGroups();
}
poll();
setInterval(poll, POLL_MS);
</script>
