<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shelter Operation Studio｜避難所運営机上訓練</title>
<style>
  :root{
    --navy:#123a5e;
    --navy-d:#0d2b47;
    --red:#d24b3e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:#eef2f5;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
  }

  /* ビジュアル：画像をそのまま表示（加工しない） */
  .hero{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0;position:relative;
  }

  /* PC(横長)とスマホ(縦長)の出し分け */
  .hero-wrap{position:relative;width:100%;max-width:1400px;margin:0 auto}
  img.hero-img{width:100%;height:auto;display:block}
  img.hero-pc{display:none}
  img.hero-sp{display:block}

  @media(min-width:820px){
    img.hero-pc{display:block;border-radius:14px;box-shadow:0 10px 40px rgba(18,58,94,.18)}
    img.hero-sp{display:none}
    .hero{padding:24px}
    .hero-wrap{max-width:1200px}
  }

  /* スタートボタン：画像の下（余白）に配置。画像は一切隠さない */
  .startbar{
    width:100%;
    display:flex;justify-content:center;
    padding:22px 16px 8px;
  }
  .start{
    position:relative;
    display:inline-flex;align-items:center;gap:12px;
    background:var(--navy);
    color:#fff;
    border:0;
    border-radius:999px;
    font-family:inherit;
    font-weight:800;
    font-size:clamp(17px,2.4vw,24px);
    letter-spacing:.04em;
    padding:clamp(14px,1.8vw,20px) clamp(30px,4vw,54px);
    cursor:pointer;
    box-shadow:0 8px 24px rgba(13,43,71,.4), 0 2px 0 rgba(255,255,255,.15) inset;
    transition:transform .12s ease, background .12s ease, box-shadow .12s ease;
    text-decoration:none;
  }
  .start:hover{
    background:var(--navy-d);
    transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(13,43,71,.5);
  }
  .start:active{ transform:translateY(0) }
  .start:focus-visible{ outline:3px solid #ffd34d; outline-offset:3px }
  .start .tri{
    width:0;height:0;
    border-style:solid;
    border-width:9px 0 9px 15px;
    border-color:transparent transparent transparent #fff;
    margin-left:2px;
  }
  /* ゆっくり脈打つ光輪で「ここから始まる」を示す（動きは1箇所だけ） */
  .start::before{
    content:"";
    position:absolute;inset:0;
    border-radius:999px;
    box-shadow:0 0 0 0 rgba(18,58,94,.45);
    animation:beat 2.6s ease-out infinite;
  }
  @keyframes beat{
    0%{box-shadow:0 0 0 0 rgba(18,58,94,.45)}
    70%{box-shadow:0 0 0 18px rgba(18,58,94,0)}
    100%{box-shadow:0 0 0 0 rgba(18,58,94,0)}
  }
  @media(prefers-reduced-motion:reduce){
    .start::before{animation:none}
    .start:hover{transform:none}
  }

  /* サブ操作（役割選択）を小さく添える */
  .roles{
    width:100%;
    display:flex;justify-content:center;gap:10px;
    padding:0 16px 22px;
  }
  .roles a{
    font-size:clamp(11px,1.4vw,13px);
    font-weight:700;
    color:var(--navy);
    background:#fff;
    border:1px solid rgba(18,58,94,.25);
    border-radius:999px;
    padding:7px 16px;
    text-decoration:none;
  }
  .roles a:hover{background:#eef2f5}
</style>
</head>
<body>

  <div class="hero">
    <div class="hero-wrap">
      <!-- スマホ用（縦長）：そのまま表示 -->
      <img class="hero-img hero-sp" src="top_mobile.png" alt="Shelter Operation Studio 避難所運営机上訓練 支え合い、明日へ">
      <!-- PC用（横長）：そのまま表示 -->
      <img class="hero-img hero-pc" src="top_pc.jpg" alt="Shelter Operation Studio 避難所運営机上訓練 支え合い、明日へ">
    </div>

    <!-- 画像の下に配置するスタートボタン（画像は隠さない） -->
    <div class="startbar">
      <a class="start" href="player.html">
        <span class="tri"></span>
        <span>訓練をはじめる</span>
      </a>
    </div>

    <!-- 役割選択（プレイヤー／ファシリテーター） -->
    <div class="roles">
      <a href="player.html">プレイヤー画面</a>
      <a href="facilitator.html">ファシリテーター用</a>
    </div>
  </div>

</body>
</html>
