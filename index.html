<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shelter Operation Studio｜避難所運営机上訓練</title>
<style>
  :root{
    --navy:#123a5e;
    --navy-d:#0d2b47;
    --red:#d24b3e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:#eef2f5;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
  }

  /* ビジュアル：画像をそのまま表示（加工しない） */
  .hero{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0;position:relative;
  }

  /* PC(横長)とスマホ(縦長)の出し分け */
  .hero-wrap{position:relative;width:100%;max-width:1400px;margin:0 auto}
  img.hero-img{width:100%;height:auto;display:block}
  img.hero-pc{display:none}
  img.hero-sp{display:block}

  @media(min-width:820px){
    img.hero-pc{display:block;border-radius:14px;box-shadow:0 10px 40px rgba(18,58,94,.18)}
    img.hero-sp{display:none}
    .hero{padding:24px}
    .hero-wrap{max-width:804px}  /* 1200px の 67% */
  }

  /* スタートボタン：画像の下（余白）に配置。画像は一切隠さない */
  /* ===== 役割選択カード ===== */
  .rolecards{
    width:100%;
    display:flex;justify-content:center;flex-wrap:wrap;gap:14px;
    padding:8px 16px 26px;
    max-width:820px;margin:0 auto;
  }
  .rolecard{
    flex:1 1 220px;max-width:250px;
    background:#fff;
    border:1px solid rgba(18,58,94,.15);
    border-radius:16px;
    padding:22px 18px;
    text-decoration:none;
    color:var(--ink);
    box-shadow:0 6px 20px rgba(18,58,94,.10);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    text-align:center;
    position:relative;
  }
  .rolecard:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(18,58,94,.18);
    border-color:var(--navy);
  }
  .rolecard:focus-visible{ outline:3px solid #ffd34d; outline-offset:3px }
  .rolecard .ic{font-size:40px;line-height:1;margin-bottom:10px}
  .rolecard .rt{font-size:18px;font-weight:900;color:var(--navy);margin-bottom:6px}
  .rolecard .rd{font-size:12.5px;color:#5a6b78;line-height:1.65}
  .rolecard .go{
    display:inline-block;margin-top:14px;
    font-size:13px;font-weight:800;color:#fff;
    background:var(--navy);border-radius:999px;
    padding:9px 22px;
  }
  .rolecard.facil{border-style:dashed}
  .rolecard.facil .go{background:var(--steel,#3f6f8f)}
  /* トップの脈打ちは主役割（プレイヤー）だけ */
  .rolecard.primary::before{
    content:"";position:absolute;inset:-1px;border-radius:16px;
    box-shadow:0 0 0 0 rgba(18,58,94,.4);
    animation:beat 2.6s ease-out infinite;pointer-events:none;
  }
  @keyframes beat{
    0%{box-shadow:0 0 0 0 rgba(18,58,94,.4)}
    70%{box-shadow:0 0 0 14px rgba(18,58,94,0)}
    100%{box-shadow:0 0 0 0 rgba(18,58,94,0)}
  }
  @media(prefers-reduced-motion:reduce){
    .rolecard.primary::before{animation:none}
    .rolecard:hover{transform:none}
  }
  .lead{
    text-align:center;font-size:14px;color:var(--navy);font-weight:700;
    padding:18px 16px 2px;
  }
</style>
</head>
<body>

  <div class="hero">
    <div class="hero-wrap">
      <!-- スマホ用（縦長）：そのまま表示 -->
      <img class="hero-img hero-sp" src="top_mobile.png" alt="Shelter Operation Studio 避難所運営机上訓練 支え合い、明日へ">
      <!-- PC用（横長）：そのまま表示 -->
      <img class="hero-img hero-pc" src="top_pc.jpg" alt="Shelter Operation Studio 避難所運営机上訓練 支え合い、明日へ">
    </div>

    <!-- 役割を選んで入室 -->
    <p class="lead">参加する役割を選んでください</p>
    <div class="rolecards">
      <a class="rolecard primary" href="player.html">
        <div class="ic">🚨</div>
        <div class="rt">LIVE表示</div>
        <div class="rd">訓練実施中の内容をLIVEで見ることができます。</div>
        <span class="go">参加する ▶</span>
      </a>
      <a class="rolecard" href="shelter_planner.html">
        <div class="ic">🗺️</div>
        <div class="rt">プレイヤー</div>
        <div class="rd">避難所の間取りを作り、配置を動かしながら対応を検討します。通知も届きます。</div>
        <span class="go">配置する ▶</span>
      </a>
      <a class="rolecard facil" href="facilitator.html">
        <div class="ic">🎛️</div>
        <div class="rt">ファシリテーター</div>
        <div class="rd">進行役。グループ管理とイベント送信を行います（合言葉が必要）。</div>
        <span class="go">運営する ▶</span>
      </a>
    </div>
  </div>

</body>
</html>
